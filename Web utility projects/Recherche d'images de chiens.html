<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Recherche d'images de chiens</title>
    <style>

        h1 {
            font-size: 2.5rem;
            text-align: center;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .grid img {
            width: 390px;
            height: 400px;
        }

        input {
            width: 80%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border: 2px solid #000000;
            border-radius: var(--border-radius);
            font-size: 1rem;
            margin-bottom: 10px;
        }

        select {
            padding: 0.8rem 1rem;
            width: 15%;
            border: 2px solid #000000;
            font-size: 1rem;
            color: #ffffff;
            background-color: rgb(0, 0, 0);
            margin-bottom: 10px;
        }

    </style>
</head>
<body>
    <h1>Liste des races de chiens</h1>
    <input type="text" id="search" placeholder="Rechercher une race...">
    <select id="breedSelect">
        <option value="">Sélectionnez une race</option>
    </select>
    <div class="grid" id="imageGrid"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const breedSelect = document.getElementById('breedSelect');
            const imageGrid = document.getElementById('imageGrid');
            const searchInput = document.getElementById('search');

            fetch('https://dog.ceo/api/breeds/list/all')
                .then(response => response.json())
                .then(data => {
                    const breeds = Object.keys(data.message);
                    updateBreedSelect(breeds);

                    searchInput.addEventListener('input', () => {
                        const searchTerm = searchInput.value.toLowerCase();
                        const filteredBreeds = breeds.filter(breed => breed.toLowerCase().includes(searchTerm));
                        updateBreedSelect(filteredBreeds);
                    });
                });

            breedSelect.addEventListener('change', () => {
                const selectedBreed = breedSelect.value;
                if (selectedBreed) {
                    fetch(`https://dog.ceo/api/breed/${selectedBreed}/images`)
                        .then(response => response.json())
                        .then(data => {
                            imageGrid.innerHTML = '';
                            data.message.forEach(imageUrl => {
                                const img = document.createElement('img');
                                img.src = imageUrl;
                                imageGrid.appendChild(img);
                            });
                        });
                } else {
                    imageGrid.innerHTML = '';
                }
            });

            function updateBreedSelect(breeds) {
                breedSelect.innerHTML = '<option value="">Sélectionnez une race</option>';
                breeds.forEach(breed => {
                    const option = document.createElement('option');
                    option.value = breed;
                    option.textContent = breed;
                    breedSelect.appendChild(option);
                });
            }
        });
    </script>
</body>
</html></select></html>
