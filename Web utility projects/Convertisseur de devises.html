<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Convertisseur de devises</title>
    <style>
        
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f0f2f5;
            color: #4a6fa5;
            line-height: 1.6;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 30px;
        }
        
        h1 {
            color: #4a6fa5;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background-color: #f9f8fa;
        }

        p {
            width: 100%;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background-color: #f9f8fa;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4a6fa5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 15px;
        }

    </style>
</head>
<body>
    <h1>Convertisseur de devises</h1>
    <form id="currency-form">
        <label for="from-currency">De :</label>
        <select id="from-currency" name="from-currency">
            <option value="USD">🇺🇸 USD - Dollar américain</option>
            <option value="EUR">🇪🇺 EUR - Euro</option>
            <option value="GBP">🇬🇧 GBP - Livre sterling</option>
            <option value="CAD">🇨🇦 CAD - Dollar canadien</option>
            <option value="MAD">🇲🇦 MAD - Dirham marocain</option>
            <option value="AUD">🇦🇺 AUD - Dollar australien</option>
            <option value="JPY">🇯🇵 JPY - Yen japonais</option>
            <option value="INR">🇮🇳 INR - Roupie indienne</option>
            <option value="BGN">🇧🇬 BGN - Lev bulgare</option>
            <option value="BRL">🇧🇷 BRL - Real brésilien</option>
            <option value="KRW">🇰🇷 KRW - Won sud-coréen</option>
            <option value="TRY">🇹🇷 TRY - Lire turque</option>
            <option value="AED">🇦🇪 AED - Dirham des EAU</option>
            <option value="LBP">🇱🇧 LBP - Livre libanaise</option>
        </select>
        <label for="to-currency">À :</label>
        <select id="to-currency" name="to-currency">
            <option value="USD">🇺🇸 USD - Dollar américain</option>
            <option value="EUR">🇪🇺 EUR - Euro</option>
            <option value="GBP">🇬🇧 GBP - Livre sterling</option>
            <option value="CAD">🇨🇦 CAD - Dollar canadien</option>
            <option value="MAD">🇲🇦 MAD - Dirham marocain</option>
            <option value="AUD">🇦🇺 AUD - Dollar australien</option>
            <option value="JPY">🇯🇵 JPY - Yen japonais</option>
            <option value="INR">🇮🇳 INR - Roupie indienne</option>
            <option value="BGN">🇧🇬 BGN - Lev bulgare</option>
            <option value="BRL">🇧🇷 BRL - Real brésilien</option>
            <option value="KRW">🇰🇷 KRW - Won sud-coréen</option>
            <option value="TRY">🇹🇷 TRY - Lire turque</option>
            <option value="AED">🇦🇪 AED - Dirham des EAU</option>
            <option value="LBP">🇱🇧 LBP - Livre libanaise</option>
        </select>
        <label for="amount">Montant :</label>
        <input type="number" id="amount" name="amount" required>
        <button type="submit">Convertir</button>
    </form>
    <p id="result"></p>

    <script>
        document.getElementById('currency-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const fromCurrency = document.getElementById('from-currency').value;
            const toCurrency = document.getElementById('to-currency').value;
            const amount = document.getElementById('amount').value;

            fetch(`https://api.exchangerate-api.com/v4/latest/${fromCurrency}`)
                .then(response => response.json())
                .then(data => {
                    const rate = data.rates[toCurrency];
                    const result = amount * rate;
                    document.getElementById('result').textContent = `${amount} ${fromCurrency} = ${result.toFixed(2)} ${toCurrency}`;
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    document.getElementById('result').textContent = 'Erreur lors de la conversion.';
                });
        });
    </script>
</body>
</html></select></form></html>
